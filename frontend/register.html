<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- Firebase init (modular) -->
<script type="module" src="js/firebase-init.js"></script>
</head>
<body>

<div class="phone-container">

    <!-- Status bar -->
    <div class="status-bar">
        <span class="time">&nbsp;&nbsp;&nbsp;9:30 PM</span>
        <div class="status-icons">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full">&nbsp;&nbsp;&nbsp;</i>
        </div>
    </div>

    <h2>Welcome to Onboard!</h2>

    <form id="registerForm">
        <input type="text" placeholder="Enter your full name" id="register_name" required>
        <input type="email" placeholder="Enter your Email" id="register_email" required>
        <input type="password" placeholder="Enter Password" id="register_password" required>
        <input type="password" placeholder="Confirm password" id="register_confirm" required>

        <button type="submit">Register</button>

        <div id="registerMessage" class="message-box"></div>
    </form>

    <p>Already have an account? <a href="index.html">Sign In</a></p>

</div>

<script src="js/main.js"></script>
</body>
</html>
