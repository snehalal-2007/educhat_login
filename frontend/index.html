<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- Firebase init (modular) -->
<script type="module" src="js/firebase-init.js"></script>
<script src="js/main.js"></script>
</head>
<body>

<div class="phone-container">
    <!-- Status bar -->
    <div class="status-bar">
        <span class="time">&nbsp;&nbsp;&nbsp;9:30 PM</span>
        <div class="status-icons">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full">&nbsp;&nbsp;&nbsp;</i>
        </div>
    </div>

    <h2>Welcome back</h2>

    <form id="loginForm">
        <input type="email" placeholder="Enter your Email" id="login_email" required>
        <input type="password" placeholder="Enter Password" id="login_password" required>

        <a href="forgot.html" class="forgot" id="forgot">Forgot password?</a>

        <button type="submit">Login</button>

        <div id="loginMessage" class="message-box"></div>
    </form>

    <p>Don’t have an account? <a href="register.html">Sign Up</a></p>
</div>

<script src="js/main.js"></script>
</body>
</html>
