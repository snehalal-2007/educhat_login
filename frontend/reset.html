<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- Firebase init (modular) -->
<script type="module" src="js/firebase-init.js"></script>
</head>
<body>

<div class="phone-container">

    <div class="status-bar">
        <span class="time">&nbsp;&nbsp;&nbsp;9:30 PM</span>
        <div class="status-icons">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full">&nbsp;&nbsp;&nbsp;</i>
        </div>
    </div>

    <h2>Choose a New Password</h2>

    <form id="resetForm">
        <input type="password" id="new_password" placeholder="New password" required>
        <input type="password" id="new_confirm" placeholder="Confirm password" required>

        <button type="submit">Reset Password</button>

        <div id="resetMessage" class="message-box"></div>
    </form>

</div>

<script src="js/main.js"></script>
</body>
</html>
